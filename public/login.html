<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · FSVP Vault</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#14202B;color:#14202B;font-family:'IBM Plex Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px;min-height:100vh;padding:48px 16px}
.box{max-width:400px;margin:0 auto;background:#fff;border-radius:12px;padding:28px 24px}
.brand{display:block;color:#fff;text-decoration:none;font-weight:700;font-size:20px;text-align:center;margin-bottom:24px}
h1{font-size:22px;margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;padding:11px 12px;min-height:44px;border:1px solid #DCDFD8;border-radius:8px;-webkit-appearance:none}
input:focus{outline:2px solid #0F5E4F;outline-offset:1px}
button{width:100%;background:#0F5E4F;color:#fff;font:inherit;font-weight:700;border:0;border-radius:8px;min-height:46px;margin-top:6px;cursor:pointer;-webkit-appearance:none}
.err{background:#FCE4E1;color:#8E2418;border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.small{color:#4A5560;font-size:13px;margin-top:16px}
a{color:#0F5E4F}
</style>
</head>
<body>
<a class="brand" href="/">FSVP Vault</a>
<div class="box">
  <h1>Sign in</h1>
  {{ERROR}}
  <form method="post" action="/login">
    <label for="email">Email<input id="email" name="email" type="email" autocomplete="username" autocapitalize="off" required></label>
    <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="small"><a href="/forgot">Forgot your password?</a> · <a href="mailto:hello@fsvpvault.com">Request access</a></p>
  <p class="small"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
</div>
</body>
</html>
