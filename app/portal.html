  // ---- edit a highlighted field in the generated FSVP plan ----
  function pfLinks(text, sec){
    var L = [], sel = ' data-sel="' + state.sel + '"';
    if (/DUNS/i.test(text)) L.push(['Importer profile (DUNS, email)', 'data-act="identity"']);
    if (/RUN FDA|NOT CHECKED/i.test(text)) L.push(['Run FDA check now', 'data-act="monitor_run"']);
    if (/QI NAME|SIGNATURE/i.test(text)) { L.push(['Record approval', 'data-act="approve"']); L.push(['Approve with conditions', 'data-act="approve_cond"']); }
    if (/NAME AND TITLE/i.test(text)) L.push(['Importer profile', 'data-act="identity"']);
    if (/ASK SUPPLIER|REGISTRATION|PROCESS RECORDS|TEST RESULTS|SPECIFICATION|CRITICAL LIMITS|DOCUMENTS ON FILE|NEEDED/i.test(text)) { L.push(['Supplier page (documents)', 'data-go="supplier"' + sel]); L.push(['Request it from the supplier', 'data-act="request" data-doc="' + esc(text.toLowerCase()) + '"']); }
    if (/pH|PROCESS|CLASSIFY|INTENDED USE/i.test(text) && sec === '2') L.push(['Edit foods and food types', 'data-act="profile"']);
    if (/QI TO DECIDE|QI TO CONFIRM|QI TO SET/i.test(text)) L.push(['Food safety plan review', 'data-act="planrev"']);
    return L;
  }
